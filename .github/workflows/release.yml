name: Release

# Builds every package on its own system and publishes them, with a SHA256SUMS file and build-provenance
# attestations, as one GitHub Release:
#   OvenTracker-<version>-win-x64-setup.exe              Windows installer: per user, fetches the .NET 11
#                                                        runtime if it's missing (signed, as is its uninstaller)
#   OvenTracker-<version>-win-x64.zip                    Windows, needs the .NET 11 runtime (signed)
#   OvenTracker-<version>-win-x64-self-contained.zip     Windows, everything included (signed)
#   oventracker_<version>_amd64.deb, _arm64.deb          Ubuntu, Debian, Raspberry Pi OS: the .NET app
#   oventracker-py_<version>_all.deb                     Ubuntu, Debian: the Python version
#   OvenTracker-<version>-linux-x64[-self-contained].tar.gz, -linux-arm64[-self-contained].tar.gz
#                                                        Linux, other distributions
#   oventracker-<version>-py3-none-any.whl, oventracker-<version>.tar.gz
#                                                        The Python version, for pipx; also published to PyPI
#                                                        when the repository variable PYPI_PUBLISH is true
#
# The Windows programs are signed with Azure Artifact Signing, and a release is never made with unsigned ones:
# the Windows job fails, and nothing is published, unless the 'release' environment is set up as
# docs/releasing.md describes. Each package is installed and run on a fresh runner before anything is published.
#
# A dry run (Actions, Release, Run workflow, with "Dry run" ticked) builds, signs and tries everything, and
# leaves the packages as the run's artifacts, but tags and publishes nothing.

on:
  push:
    tags:
      - 'v*' # pushing tag v1.2.0 publishes release v1.2.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.0 (no leading v). Unless a dry run, tags the commit v<version> and publishes it.'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build, sign and try everything, but publish nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release # never two publishes at once
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          v="${INPUT#v}"; v="${v#V}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]] || { echo "::error::'$v' is not an X.Y.Z version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

  linux:
    name: Linux (${{ matrix.rid }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm # built and tried on ARM itself
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test, build and pack
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          ./build.ps1 -Runtime ${{ matrix.rid }} -Version $v
          & ./artifacts/publish/${{ matrix.rid }}/OvenTracker --version
          if ($LASTEXITCODE -ne 0) { throw "The packaged program didn't run ($LASTEXITCODE)." }
          ./build.ps1 -Runtime ${{ matrix.rid }} -Version $v -SelfContained -SkipTests
      - name: Build the .deb (from the self-contained build)
        run: bash packaging/build-deb.sh dotnet '${{ needs.version.outputs.version }}' ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }}
      - name: Install, run and remove the .deb
        run: |
          sudo apt-get install -y ./artifacts/oventracker_*.deb
          test "$(oventracker --version)" = '${{ needs.version.outputs.version }}'
          test -f /usr/share/applications/oventracker.desktop
          sudo apt-get remove -y oventracker
          ! command -v oventracker
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
          if-no-files-found: error

  windows:
    name: Windows (win-x64, signed)
    needs: version
    # The protected 'release' environment holds the signing identity's IDs (variables, not secrets), and
    # requires a reviewer's approval before this job runs.
    environment: release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # azure/login swaps GitHub's OIDC token for the signing identity: no secret is stored
    steps:
      - name: Check signing is set up
        shell: pwsh
        run: |
          if (-not '${{ vars.AZURE_CLIENT_ID }}') {
            throw "The 'release' environment has no AZURE_CLIENT_ID, so the Windows programs can't be signed, and an unsigned Windows build is never released. See docs/releasing.md."
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Sign in to Azure for signing (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Test, build, sign and pack
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $sign = './packaging/Sign-ArtifactSigning.ps1'
          # The self-contained build first: the installer takes the framework-dependent one, published last.
          ./build.ps1 -Runtime win-x64 -Version $v -SelfContained -SignScript $sign
          ./build.ps1 -Runtime win-x64 -Version $v -SkipTests -SignScript $sign
          ./packaging/build-installer.ps1 -Version $v -SignScript $sign
      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $setup = "artifacts/OvenTracker-$v-win-x64-setup.exe"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=addtopath', '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "The installer failed ($($p.ExitCode))." }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OvenTracker'
          foreach ($file in 'OvenTracker.exe', 'OvenTracker.dll', 'unins000.exe') {
            $s = Get-AuthenticodeSignature (Join-Path $dir $file)
            if ($s.Status -ne 'Valid') { throw "$file installed without a valid signature: $($s.Status)" }
          }
          $out = & (Join-Path $dir 'OvenTracker.exe') --version
          if ($LASTEXITCODE -ne 0 -or "$out".Trim() -ne $v) { throw "The installed program said '$out' ($LASTEXITCODE)." }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*$dir*") { throw 'The installer didn''t add OvenTracker to the PATH.' }
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'OvenTracker.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'OvenTracker.exe')) { throw 'The uninstaller left OvenTracker.exe behind.' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$dir*") { throw 'The uninstaller left OvenTracker on the PATH.' }
          Write-Host 'Installed, signed, ran, and uninstalled cleanly.'
      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
          if-no-files-found: error
      - name: Sign out of Azure
        if: always()
        shell: pwsh
        run: az logout; az account clear

  python:
    name: Python version
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set the version, test and build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" python/pyproject.toml
          grep -q "^version = \"$VERSION\"" python/pyproject.toml || { echo "::error::couldn't set the version in python/pyproject.toml"; exit 1; }
          python -m pip install build "./python[test]"
          python -m pytest python/tests -q
          python -m build python --outdir dist-python
      - name: Build the .deb
        run: bash packaging/build-deb.sh python '${{ needs.version.outputs.version }}' dist-python/oventracker-${{ needs.version.outputs.version }}-py3-none-any.whl
      - name: Install, run and remove the .deb (with Ubuntu's own Python packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./artifacts/oventracker-py_*_all.deb
          test "$(/usr/bin/oventracker-py --version)" = '${{ needs.version.outputs.version }}'
          sudo apt-get remove -y oventracker-py
          ! test -e /usr/bin/oventracker-py
      - uses: actions/upload-artifact@v4
        with:
          name: release-python # the wheel and sdist: what goes to PyPI
          path: dist-python/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-deb
          path: artifacts/*.deb
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, linux, windows, python]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create, with the workflow's own token
      id-token: write # the attestations' signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Attest where each file was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Release notes, from the changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The version's section of CHANGELOG.md: from its "## <version>" heading to the next "## ".
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then cat notes.md; else echo "::warning::CHANGELOG.md has no section for $VERSION"; fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OvenTracker $VERSION" "${notes[@]}"

  pypi:
    name: Publish to PyPI
    needs: [version, publish]
    # PyPI's trusted publishing: PyPI trusts this workflow in the 'pypi' environment, so no token is stored.
    # Off until it's set up on PyPI and the repository variable PYPI_PUBLISH is 'true' (docs/releasing.md).
    if: vars.PYPI_PUBLISH == 'true'
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
