name: CI

# Builds and tests on Windows and Linux for every push to main and every pull request, so a change that
# works on one system and breaks the other is caught before it is merged. On Linux it also publishes the
# app and runs a whole simulated session in a terminal, as a person would. The Python port is tested on both
# systems, and the C# and Python analyses must agree on every case in testdata/ (spec/testdata.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false # a failure on one system shouldn't hide the result on the other
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (the SDK in global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build OvenTracker.slnx -c Release

      - name: Test
        run: dotnet test OvenTracker.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish and try it (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./build.ps1 -Runtime linux-x64 -SkipTests
          $app = './artifacts/publish/linux-x64/OvenTracker'
          & $app --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed ($LASTEXITCODE)" }
          & $app meters
          if ($LASTEXITCODE -ne 0) { throw "meters failed ($LASTEXITCODE)" }
          # A whole simulated session with its output to a log file, as with nohup or tee: no terminal, so
          # progress lines instead of the live display.
          & $app run --simulate --speed 3000 -y --unit F --modes bake,convection --setpoints 350 --out run *> run.log
          if ($LASTEXITCODE -ne 0) { Get-Content run.log; throw "the simulated session failed ($LASTEXITCODE)" }
          foreach ($f in 'report.md', 'results.json', 'readings.csv', 'session.json') {
            if (-not (Test-Path "run/$f")) { Get-Content run.log; throw "the simulated session wrote no $f" }
          }
          # Colours are fine in a log (Spectre colours CI output); cursor movement, screen clearing and redraws
          # (escape sequences ending in anything but "m") are what broke it.
          if (Select-String -Path run.log -Pattern "`e\[[0-9;?]*[A-Za-ln-z]" -CaseSensitive -Quiet) { throw "the log has cursor or screen control codes in it" }
          Get-Content run.log | Select-Object -Last 15
          Get-Content run/report.md -TotalCount 12

  python:
    name: Python port (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up .NET (so the C# app can check the Python app's recordings and screens)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install
        run: python -m pip install ./python[test]

      - name: Test (every testdata case, the engine and screens, and the C# app on Python's recordings)
        run: python -m pytest python/tests -q

  cross-check:
    name: Cross-check C# and Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (the SDK in global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the Python package
        run: python -m pip install ./python

      - name: Both analyze every case, and the outputs must agree (spec/testdata.md)
        shell: pwsh
        run: ./testdata/cross-check.ps1

  parity:
    name: Parity reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when the analysis or formats change on one side only
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          covered=$(echo "$changed" | grep -E '^src/OvenTracker/(Analysis/|Session/(Recording|Report)\.cs|Ovens/|Meter/Probes\.cs|Temperature\.cs|Commands/(AnalyzeCommand|SharedSettings)\.cs)' || true)
          if [ -n "$covered" ] && ! echo "$changed" | grep -qE '^(python/|spec/|testdata/)'; then
            echo "::warning title=Parity::This PR changes code the spec covers ($(echo $covered | tr '\n' ' ')) but not python/, spec/ or testdata/. If behaviour changed, update them, or open a follow-up issue labelled 'parity' (see the PR template)."
          fi
