[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oventracker"
# The release workflow rewrites this line with the release version (the C# app's <Version>).
version = "1.0.0"
description = "OvenTracker in Python: measure an oven's temperature accuracy with a meter (or the simulator), and analyse the runs, as the C# app does."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "The Schnauzer Group LLC" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
# rich draws the console; pyserial is imported only when a serial meter (the U1253B, or the 34401A on RS-232) is
# used, so the simulator runs without it. The analysis itself needs only the standard library.
dependencies = ["rich>=13", "pyserial>=3.5"]

[project.optional-dependencies]
# PyVISA, for the 34401A on GPIB: imported only when a VISA resource is used, so everything else runs without it.
visa = ["pyvisa>=1.13"]
# bleak, for the EEVblog 121GW and UNI-T UT60BT over Bluetooth LE: imported only when one is used.
ble = ["bleak>=3.0"]
test = ["pytest"]

[project.scripts]
oventracker-py = "oventracker.cli:main"

[project.urls]
Homepage = "https://github.com/TGoodhew/OvenTracker"

[tool.hatch.build.targets.wheel]
packages = ["src/oventracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
